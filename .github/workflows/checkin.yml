name: Check in

on:
  workflow_dispatch:

  # UTC时间，对应Beijing时间 8：30
  schedule:
      - cron: "26 23 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Debug Cookie
        env:
          ANDROID_COOKIE: ${{ secrets.ANDROID_COOKIE }}
        run: |
          echo "Cookie length: ${#ANDROID_COOKIE}"
          echo "Cookie first 50 chars: ${ANDROID_COOKIE:0:50}"

      - name: Test Checkin
        env:
          ANDROID_COOKIE: ${{ secrets.ANDROID_COOKIE }}
          SK: ${{ secrets.SK }}
        run: python -c "
          import os, sys
          sys.path.insert(0, 'app')
          from utils.smzdm_bot import SmzdmBot
          bot = SmzdmBot(ANDROID_COOKIE=os.environ['ANDROID_COOKIE'], SK=os.environ.get('SK', ''))
          resp = bot.request('POST', 'https://user-api.smzdm.com/checkin')
          print('Status:', resp.status_code)
          print('Response:', resp.text)
        "

      - name: Working
        env:
          ANDROID_COOKIE: ${{ secrets.ANDROID_COOKIE }}
          SK: ${{ secrets.SK }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          SC_KEY: ${{ secrets.SC_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_BOT_API: ${{ secrets.TG_BOT_API }}
        run: python app/main.py
